<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="3xØc3t CRT Screen Subiminal">
    <meta name="theme-color" content="#000000">
    <title>91_CRT_Screen_Subiminal</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<main id="crt-screen" class="crt-screen">

```
<div class="crt-glow"></div>
<div class="crt-scanlines"></div>
<div class="crt-noise"></div>
<div class="crt-vignette"></div>

<header class="crt-header">

    <div class="header-block header-brand">
        <img src="medias/3x0c3t_LOGO.png" alt="3x0c3t" class="header-logo">
        <span class="header-brand-text">-3xØc3t-</span>
    </div>

    <div class="header-block header-title">
        <span>CRT SCREEN / SUBIMINAL</span>
    </div>

    <div class="header-block header-status">
        <span class="status-label">SYSTEM ONLINE</span>
    </div>

    <div class="header-block header-clock">
        <span id="clock">00:00:00</span>
    </div>

    <div class="header-block header-lab">
        <span>3x0c3t_L4B</span>
    </div>

</header>

<section class="crt-content">

    <div class="signal-frame">
        <div class="signal-line signal-line-1"></div>
        <div class="signal-line signal-line-2"></div>
        <div class="signal-line signal-line-3"></div>
    </div>

    <div id="main-message" class="main-message">
        <span>INITIALIZING</span>
    </div>

    <div id="sub-message" class="sub-message">
        DIGITAL SIGNAL ACTIVE
    </div>

</section>
```

</main>

<script src="index.js"></script>

</body>
</html>
