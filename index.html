<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="3xØc3t CRT Screen Subiminal">
    <meta name="theme-color" content="#000000">
    <title>91_CRT_Screen_Subiminal</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <main id="crt-screen" class="crt-screen">

        <div class="crt-glow"></div>
        <div class="crt-scanlines"></div>
        <div class="crt-noise"></div>
        <div class="crt-vignette"></div>

        <section class="screen-content">

            <header class="screen-header">
                <div class="system-id">-3xØc3t-</div>
                <div class="system-title">CRT SCREEN / SUBIMINAL</div>
                <div class="system-status">SYSTEM ONLINE</div>
            </header>

            <section class="screen-center">
                <div id="main-message" class="main-message">
                    <span>INITIALIZING</span>
                </div>

                <div id="sub-message" class="sub-message">
                    DIGITAL SIGNAL ACTIVE
                </div>

                <div class="signal-frame">
                    <div class="signal-line"></div>
                    <div class="signal-line"></div>
                    <div class="signal-line"></div>
                </div>
            </section>

            <footer class="screen-footer">
                <span>91_CRT_SCREEN_SUBIMINAL</span>
                <span id="clock">00:00:00</span>
                <span>3x0c3t_L4B</span>
            </footer>

        </section>

    </main>

    <script src="index.js"></script>
</body>
</html>
